name: Docker image build

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 预发布（-rc/-alpha/-beta，由 release.yml 自动标记 prerelease）只推
          # 版本号 tag，不推 latest，避免 :latest 被 rc 版本覆盖。
          # 表达式为空字符串的行会被 build-push-action 忽略。
          tags: |
            zaunist/emailbox:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && 'zaunist/emailbox:latest' || '' }}
