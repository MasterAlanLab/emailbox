    <rect x="846" y="291" width="76" height="7" rx="3.5" fill="#E7E5E4"/>
    <circle cx="1021" cy="278" r="7" fill="#22C55E"/>

    <rect x="774" y="334" width="274" height="76" rx="14" fill="#FFFFFF" stroke="#E7E5E4"/>
    <rect x="798" y="356" width="30" height="30" rx="9" fill="#EFF6FF"/>
    <path d="M806 363.5C806 361.567 807.567 360 809.5 360H816.5C818.433 360 820 361.567 820 363.5V378.5C820 380.433 818.433 382 816.5 382H809.5C807.567 382 806 380.433 806 378.5V363.5Z" stroke="#3B82F6" stroke-width="2"/>
    <path d="M807 364L813 369L819 364" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="846" y="352" width="148" height="8" rx="4" fill="#44403C"/>
    <rect x="846" y="370" width="122" height="7" rx="3.5" fill="#D6D3D1"/>
    <rect x="846" y="385" width="92" height="7" rx="3.5" fill="#E7E5E4"/>
    <circle cx="1021" cy="372" r="7" fill="#F6821F"/>

    <rect x="774" y="428" width="274" height="34" rx="10" fill="#292524"/>
    <rect x="796" y="442" width="104" height="6" rx="3" fill="#A8A29E"/>
    <rect x="926" y="442" width="96" height="6" rx="3" fill="#57534E"/>
  </g>

  <text x="108" y="548" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="2.4">EMAILBOX</text>
  <text x="1092" y="548" fill="#A8A29E" font-family="Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="end">WEB · DOCKER · DESKTOP</text>
</svg>
