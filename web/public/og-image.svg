<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Emailbox · 批量邮箱托管平台</title>
  <desc>导入、托管、统一收信，集中管理第三方邮箱账号。</desc>
  <defs>
    <linearGradient id="brand" x1="112" y1="104" x2="208" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6821F"/>
      <stop offset="1" stop-color="#FBAD41"/>
    </linearGradient>
    <linearGradient id="glow" x1="866" y1="112" x2="1112" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#F5F5F4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#D6D3D1" stroke-opacity="0.34"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#292524" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F5F5F4"/>
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="2"/>
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="url(#grid)"/>
  <path d="M32 112C232 64 390 70 570 122C778 182 925 184 1168 104V32H32V112Z" fill="#FFF7ED" fill-opacity="0.72"/>
  <circle cx="1090" cy="92" r="86" fill="#F6821F" fill-opacity="0.08"/>
  <circle cx="1090" cy="92" r="54" fill="#F6821F" fill-opacity="0.06"/>

  <!-- Brand mark -->
  <rect x="104" y="104" width="96" height="96" rx="24" fill="url(#brand)"/>
  <path d="M127 132.5C127 127.253 131.253 123 136.5 123H167.5C172.747 123 177 127.253 177 132.5V171.5C177 176.747 172.747 181 167.5 181H136.5C131.253 181 127 176.747 127 171.5V132.5Z" stroke="white" stroke-width="5"/>
  <path d="M129.5 132L152 151L174.5 132" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 171L145 157.5M174 171L159 157.5" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Wordmark and promise -->
  <text x="228" y="158" fill="#1C1917" font-family="Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.5">Emailbox</text>
  <text x="106" y="280" fill="#1C1917" font-family="Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="50" font-weight="750" letter-spacing="-1.5">批量邮箱托管平台</text>
  <text x="108" y="328" fill="#57534E" font-family="Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="25" font-weight="450">导入 · 托管 · 统一收信</text>
  <text x="108" y="376" fill="#78716C" font-family="Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="21" font-weight="450">把第三方邮箱账号、令牌与收件箱集中到一个清晰的工作台</text>

  <!-- Feature tags -->
  <g font-family="Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="18" font-weight="650">
    <rect x="108" y="430" width="178" height="48" rx="12" fill="#FFFFFF" stroke="#D6D3D1"/>
    <circle cx="132" cy="454" r="5" fill="#F6821F"/>
    <text x="148" y="461" fill="#44403C">多服务商接入</text>
    <rect x="300" y="430" width="178" height="48" rx="12" fill="#FFFFFF" stroke="#D6D3D1"/>
    <circle cx="324" cy="454" r="5" fill="#3B82F6"/>
    <text x="340" y="461" fill="#44403C">令牌自动维护</text>
    <rect x="492" y="430" width="178" height="48" rx="12" fill="#FFFFFF" stroke="#D6D3D1"/>
    <circle cx="516" cy="454" r="5" fill="#22C55E"/>
    <text x="532" y="461" fill="#44403C">租户数据隔离</text>
  </g>

